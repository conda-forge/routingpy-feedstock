schema_version: 1

context:
  version: "1.3.0"

package:
  name: routingpy
  version: ${{ version }}

source:
  url: https://github.com/routingpy/routingpy/archive/refs/tags/${{ version }}.tar.gz
  sha256: 80126dc6c2d41cbd435380f0abca7a19a91ef5d04bdc3fc07e85f211a2a3fc2d

build:
  number: 1
  noarch: python
  script:
    # GitHub tarballs lack the git metadata setuptools-scm needs
    - export SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }}
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=45
    - setuptools_scm >=6.2
  run:
    - python >=${{ python_min }}
    - requests >=2.2.0,<3.0.0
  run_constraints:
    - shapely >=2.0.0,<3
    - ipykernel >=6.0.0,<7
    - matplotlib-base >=3.4.1,<4
    - contextily >=1.1.0,<2
    - geopandas >=0.8.2,<0.9.0
    - descartes >=1.0.0,<2

tests:
  - python:
      imports:
        - routingpy
        - routingpy.routers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Python library to access all public routing, isochrones and matrix APIs in a consistent manner.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/routingpy/
  repository: https://github.com/routingpy/routingpy

extra:
  recipe-maintainers:
    - knaaptime
    - ickc
    - synapticarbors
